name: Build Paper Thoughts Native APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Release Signing Keystore
        run: |
          mkdir -p android/app/keystore
          keytool -genkey -v \
            -keystore android/app/keystore/release.keystore \
            -alias paperthoughts \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "PaperThoughts2026" \
            -keypass "PaperThoughts2026" \
            -dname "CN=Paper Thoughts, OU=Engineering, O=Paper Thoughts Literary, L=Zaria, ST=Kaduna, C=NG"

      - name: Build Signed Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Stage APK for Distribution
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} dist/PaperThoughts.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperThoughts-APK
          path: dist/PaperThoughts.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: Paper Thoughts Native Android App (v1.0.0)
          body: |
            ## 🏛️ Paper Thoughts Native Android APK
            Official standalone native Android release for Paper Thoughts.
            
            - **Zero URL Bar**: True edge-to-edge native reading experience.
            - **New Official Brand Icon**: Custom Paper Thoughts Triad Emblem on warm cream.
            - **Google Sign-In & Clerk Auth**: Clean WebView with no OAuth security blocks.
            - **Hardware Navigation**: Smooth device back-button and swipe gestures.
            - **File & Photo Uploads**: Supported for attendance proof and avatars.
            
            Download `PaperThoughts.apk` below and install directly on Android.
          files: dist/PaperThoughts.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
